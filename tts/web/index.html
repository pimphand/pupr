<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test TTS / STT / AI</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #222; }
  button { padding: 10px 18px; font-size: 16px; cursor: pointer; }
  #log { margin-top: 20px; white-space: pre-wrap; background: #f5f5f5; padding: 12px; border-radius: 6px; min-height: 60px; }
  audio { margin-top: 12px; width: 100%; }
</style>
</head>
<body>
<h1>Test Suara ke AI</h1>
<p>Tekan <b>Mulai Bicara</b>, bicara, lalu tekan <b>Berhenti</b>.</p>
<button id="btn">Mulai Bicara</button>
<div id="status"></div>
<div id="log"></div>
<audio id="player" controls></audio>

<script>
const btn = document.getElementById('btn');
const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');
const player = document.getElementById('player');
let recorder = null;
let chunks = [];

function setStatus(t) { statusEl.textContent = t; }
function addLog(t) { logEl.textContent += t + '\n'; }

async function postJson(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(url + ' HTTP ' + r.status + ': ' + (await r.text()).slice(0, 300));
  return r;
}

// MediaRecorder menghasilkan WebM/Ogg; /stt hanya membaca WAV PCM, jadi konversi di browser.
async function toWav(blob) {
  const ctx = new AudioContext();
  const buf = await ctx.decodeAudioData(await blob.arrayBuffer());
  ctx.close();
  const rate = buf.sampleRate, n = buf.length;
  const mono = new Float32Array(n);
  for (let c = 0; c < buf.numberOfChannels; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < n; i++) mono[i] += d[i] / buf.numberOfChannels;
  }
  const out = new DataView(new ArrayBuffer(44 + n * 2));
  const str = (o, s) => { for (let i = 0; i < s.length; i++) out.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); out.setUint32(4, 36 + n * 2, true); str(8, 'WAVE');
  str(12, 'fmt '); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 1, true);
  out.setUint32(24, rate, true); out.setUint32(28, rate * 2, true); out.setUint16(32, 2, true); out.setUint16(34, 16, true);
  str(36, 'data'); out.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) {
    const s = Math.max(-1, Math.min(1, mono[i]));
    out.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return new Blob([out], { type: 'audio/wav' });
}

async function processAudio(blob) {
  setStatus('Mengubah suara ke teks...');
  const form = new FormData();
  form.append('audio', await toWav(blob), 'speech.wav');
  const sttRes = await fetch('/stt', { method: 'POST', body: form });
  const stt = await sttRes.json();
  if (!sttRes.ok) throw new Error('STT: ' + (stt.error || sttRes.status));
  if (!stt.text) { addLog('(suara tidak terdeteksi)'); return; }
  addLog('Anda: ' + stt.text);

  setStatus('Mengirim ke AI...');
  const ai = await (await postJson('/ai', { text: stt.text })).json();
  addLog('AI: ' + ai.text);

  setStatus('Mengubah jawaban ke suara...');
  const tts = await postJson('/tts', { text: ai.text });
  player.src = URL.createObjectURL(await tts.blob());
  setStatus('Selesai. Jawaban sedang diputar.');
  player.play().catch(() => setStatus('Selesai. Klik tombol ▶ di pemutar untuk mendengar jawaban.'));
}

btn.onclick = async () => {
  if (recorder && recorder.state === 'recording') {
    recorder.stop();
    btn.disabled = true;
    btn.textContent = 'Memproses...';
    setStatus('Rekaman selesai, memproses...');
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      try {
        await processAudio(new Blob(chunks, { type: recorder.mimeType }));
      } catch (e) {
        setStatus('Error');
        addLog('Error: ' + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Mulai Bicara';
      }
    };
    recorder.start();
    btn.textContent = 'Berhenti';
    setStatus('Merekam...');
  } catch (e) {
    setStatus('Mikrofon tidak bisa diakses: ' + e.message);
  }
};
</script>
</body>
</html>
